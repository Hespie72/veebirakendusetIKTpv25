<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Piltide vahetus JS abil</title>
    <link rel="stylesheet" href="piltideVahetusStyle.css">
    <script src="../javascript/piltScript.js"></script>
</head>
<body>
<!-- Paint 4 pilti: smile.png, neutral.png, kurb.png, lill.png
300x300  -->
<h1>Juhuslik pilt</h1>
<img src="lill.png" alt="" id="randomPilt">
<input type="button" onclick="juhuslikPilt()" value="vaheta pilt">
<section id="myistatus">
<h2>Mõistatus. Arva ära mida näed pildid?</h2>

<label for="valik">Tee oma valik</label>

<select name="valik" id="valik" onchange="selectValik()">
    <option value="vali">vali</option>
    <option value="../pilti/smile.png">smile</option>
    <option value="../pilti/neutral.png">neutral</option>
    <option value="../pilti/kurb.png">kurb</option>
    <option value="../pilti/lill.png">lill</option>
</select>
<div id="vastus">Siia tuleb vastus</div>
</section>
<section id="valik2">
    <h2>Pildi kuvamiseks vali sobiv</h2>
    <input type="radio" name="piltValik" id="v1" value="../pilti/smile.png" onclick="radioValik()">
    <label for="v1">Smile pilt</label>
    <br>
    <input type="radio" name="piltValik" id="v2" value="../pilti/neutral.png" onclick="radioValik()">
    <label for="v2">Neutral pilt</label>
    <br>
    <input type="radio" name="piltValik" id="v3" value="../pilti/kurb.png" onclick="radioValik()">
    <label for="v3">Kurb pilt</label>
    <br>
    <input type="radio" name="piltValik" id="v4" value="../pilti/lill.png" onclick="radioValik()">
    <label for="v4">Lill pilt</label>
    <br>
    <img src="" alt="" id="valitudPilt">

</section>
</body>
</html>
