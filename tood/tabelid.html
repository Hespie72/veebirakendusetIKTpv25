<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Tabelid</title>
    <link rel="stylesheet" href="tabelStyle.css">
</head>
<body>
<h1>Tabelid</h1>
<h2>Lihtne tabel</h2>
<table id="lihtne">
    <tr>
        <td class="nimia">A</td>
        <td>B</td>
    </tr>
    <tr>
        <td>C</td>
        <td>D</td>
    </tr>
</table>
<h2>Tabel kus on ühendayud lahtrid</h2>
<table id="keeruline1">
    <tr>
    <td colspan="2" class="nimia">A</td>
</tr>
    <tr>
        <td>C</td>
        <td>D</td>
    </tr>
</table>
<h2>Veel üks tabel kus on ühendatud lahtrid</h2>
<table id="keeruline2">
    <tr>
        <td rowspan="2" class="nimia">A</td>
        <td>B</td>
    </tr>
    <tr>
        <td>D</td>
    </tr>
</table>
<h2>oma tabel isetöö</h2>
<table id="keeruline3">
    <tr>
        <td colspan="2" rowspan="4" class="nimia">A</td>
        <td colspan="3">B</td>
    </tr>
    <tr>
        <td rowspan="1">C</td>
        <td rowspan="1">D</td>
        <td colspan="1" rowspan="3">E</td>
    </tr>
    <tr>

        <td colspan="2" rowspan="1">F</td>
    </tr>
    <tr>
        <td colspan="2" rowspan="1">G</td>
    </tr>



</table>
</body>
</html>
