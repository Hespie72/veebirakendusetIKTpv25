<!DOCTYPE html>
<html lang="ee">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
    <link rel="stylesheet" href="vormStyle.css">
    <script src="../tood/javascript/kusimustikScript.js"></script>
</head>
<body>
<h1>Muusika küsimustik</h1>
<div>HTML vormid ja nupud</div>
<form action="#">
<!-- c + tab komentaar -->
    <table>
        <tr>
            <td>
                <!-- Tekstkast -->
                <label for="nimi">Nimi: </label>
            </td>
            <td>
                <input type="text" id="nimi" placeholder="Vitalii" oninput="nimiLugemineKastist()">
            </td>
            <td>
                <div id="vastus1"></div>
            </td>
        </tr>
        <tr>
            <td>
                <!-- ripploend või rippmenüü -->

                <label for="stiil">Vali meeldivaim muusikastiil</label>
            </td>
            <td>
                <select name="stiil" id="stiil" onchange="selectValik()">
                    <option value="vali">vali...</option>
                    <option value="hiphop">hiphop</option>
                    <option value="kantri">kantri</option>
                    <option value="rock">rock</option>
                    <option value="metal">metal</option>
                    <option value="jazz">jazz</option>
                </select>
            </td>
            <td>
                <div id="vastus5"></div>
            </td>
        </tr>
        <tr>
            <td>
                <!-- radio nupud -üks valik mitmest -->
                    Kuidas sa muusikat peamiselt kuulad?
            </td>
            <td>
                <input type="radio" name="platvorm" id="spotify" value="spotify" onclick="radioValikud()">
                <label for="spotify">Spotify</label>
                <br>
                <input type="radio" name="platvorm" id="soundcloud" value="soundcloud" onclick="radioValikud()">
                <label for="soundcloud">Soundcloud</label>
                <br>
                <input type="radio" name="platvorm" id="youtube" value="youtube" onclick="radioValikud()">
                <label for="youtube">YouTube</label>
                <br>
                <input type="radio" name="platvorm" id="raadio" value="raadio" onclick="radioValikud()">
                <label for="raadio">Raadio</label>
            </td>
            <td>
                <div id="vastus2"></div>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <!-- checkbox -->
                <fieldset>
                    <legend>Tee oma valikud - lemmik ansambel</legend>
                    <input type="checkbox" name="lemmikud" id="radiohead" value="radiohead" onchange="checkBoxValik()">
                    <label for="radiohead">Radiohead</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="the-smashing-pumpkins" value="the-smashing-pumpkins" onchange="checkBoxValik()">
                    <label for="the-smashing-pumpkins">The Smashing Pumpkins</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="the-smiths" value="the-smiths" onchange="checkBoxValik()">
                    <label for="the-smiths">The Smiths</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="have-a-nice-life" value="have-a-nice-life" onchange="checkBoxValik()">
                    <label for="have-a-nice-life">Have A Nice Life</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="slowdive" value="slowdive" onchange="checkBoxValik()">
                    <label for="slowdive">Slowdive</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="muse" value="muse" onchange="checkBoxValik()">
                    <label for="muse">Muse</label>
                    <br>
                </fieldset>
            </td>
            <td>
                <div id="vastus3"></div>
            </td>
        </tr>
        <tr>
            <td>
                <!-- range - vahemik -->
                <label for="tund">
                    Mitu tundi päevas sa kuulad muusikat
                </label>
            </td>
            <td>
                0<input type="range" id="tund" min="0" max="24" value="12" onchange="rangeValik()">24
            </td>
            <td>
                <div id="vastus4"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="arvamus">Mida arvad muusika kuulamisest koolis?</label>
            </td>
            <td>
                <textarea name="arvamus" id="arvamus" cols="30" rows="10" oninput="arvamusLugemine()"></textarea>
            </td>
            <td>
                <div id="vastus6"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label>Kas sa kuulad raadiot?</label>
            </td>
            <td>
                <input type="radio" name="radiovalik" id="jah" value="jah" onclick="radiovalik1()">
                <label for="jah">Jah</label>
                <input type="radio" name="radiovalik" id="ei" value="ei" onclick="radiovalik1()">
                <label for="ei">Ei</label>
            </td>
            <td>
                <div id="vastus7"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="raadiojaam">Milliseid raadiojaamu oskad nimetada?</label>
            </td>
            <td>
                <input type="text" name="raadiojaam" id="raadiojaam" placeholder="sky raadio" oninput="raadiojaama()">
            </td>
            <td>
                <div id="vastus8"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="data">Mis päev täna on</label>
            </td>
            <td><input type="date" id="data" name="data"></td>
        </tr>
        <tr>
            <td>
                <label for="myfile">Vali a file (muusikainstrument):</label>
            </td>
            <td>
                <input type="file" id="myfile" name="myfile">
            </td>
        </tr>
        <tr>
            <td>
                <label for="homepage">Lisa URl sinu lemmik laul:</label>
            </td>
            <td>
                <input type="url" id="homepage" name="homepage">
            </td>
        </tr>
        <tr>
            <td><label for="quantity">Kui sageli sa muusikat kuulad? (1 kuni 5):</label></td>
            <td>  <input type="number" id="quantity" name="quantity" min="1" max="5"></td>
        </tr>
        <tr>
            <td><label for="favcolor">Millist värvi seostad oma lemmikbändiga?:</label></td>
            <td><input type="color" id="favcolor" name="favcolor"></td>
        </tr>
        <tr>
            <td>
                saada vorm
            </td>
            <td><input type="submit" value="Submit"></td>
        </tr>
        <tr>
            <td>
                <input type="reset" value="Puhasta" onclick="puhasta()">
            </td>

            <td>
                <input type="button" value="Näita/loe andmed" onclick="naitaKoike()">
            </td>
            <td>
                <div id="vastusKoik"></div>
            </td>
        </tr>
    </table>

</form>
</body>
</html>
