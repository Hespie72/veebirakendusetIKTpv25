<!DOCTYPE html>
<html lang="ee">
<head>
    <meta charset="UTF-8">
    <title>Muusika küsimustik</title>
</head>
<body>
<h1>Muusika küsimustik</h1>
<div>HTML vormid ja nupud</div>
<form action="#">
<!-- c + tab komentaar -->
<!-- Tekstkast -->
<label for="nimi">Nimi: </label>
<input type="text" id="nimi" placeholder="Vitalii" autofocus required>
    <!-- ripploend või rippmenüü -->

    <label for="stiil">Vali meeldivaim muusikastiil</label>
    <br>
    <select name="stiil" id="stiil">
        <option value="vali">vali...</option>
        <option value="hiphop">hiphop</option>
        <option value="kantri">kantri</option>
        <option value="rock">rock</option>
        <option value="metal">metal</option>
        <option value="jazz">jazz</option>
    </select>
    <br>
    <!-- radio nupud -üks valik mitmest -->
    <label for="">
        Kuidas sa muusikat peamiselt kuulad?
    </label>
    <br>
    <input type="radio" name="platvorm" id="spotify">
    <label for="spotify">Spotify</label>
    <br>
    <input type="radio" name="platvorm" id="soundcloud">
    <label for="soundcloud">Soundcloud</label>
    <br>
    <input type="radio" name="platvorm" id="youtube">
    <label for="youtube">YouTube</label>
    <br>
    <input type="radio" name="platvorm" id="raadio">
    <label for="raadio">Raadio</label>

    <!-- checkbox -->
    <fieldset>
        <legend>Tee oma valikud - lemmik ansambel</legend>
        <input type="checkbox" name="lemmikud" id="radiohead">
        <label for="radiohead">Radiohead</label>
        <br>
        <input type="checkbox" name="lemmikud" id="the smashing pumpkins">
        <label for="the smashing pumpkins">The Smashing Pumpkins</label>
        <br>
        <input type="checkbox" name="lemmikud" id="the smiths">
        <label for="the smiths">The Smiths</label>
        <br>
        <input type="checkbox" name="lemmikud" id="have a nice life">
        <label for="have a nice life">Have A Nice Life</label>
        <br>
        <input type="checkbox" name="lemmikud" id="slowdive">
        <label for="slowdive">Slowdive</label>
        <br>
        <input type="checkbox" name="lemmikud" id="muse">
        <label for="muse">Muse</label>
    </fieldset>

</form>
</body>
</html>
